name: Verify canonical Kapital Tilda page

on:
  pull_request:
    paths:
      - 'kapital-7k.html'
      - 'assets/tilda-v92/screens/**'
      - 'scripts/verify-landing-v92.mjs'
      - '.github/workflows/verify-landing-v92.yml'
      - 'assets/**'

permissions:
  contents: read

jobs:
  verify-landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check user's Tilda HTML and new phone images
        run: node scripts/verify-landing-v92.mjs
